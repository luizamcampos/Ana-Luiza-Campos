<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>303 — Ana Luiza Campos</title>

  <style>

    @font-face {
      font-family: "Neue Montreal";
      src: url("./NeueMontreal-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --fundo: #f3f2ed;
      --preto: #111111;
      --azul: #2455ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--fundo);
      color: var(--preto);
      font-family: "Neue Montreal", sans-serif;
    }

    .project {
      width: 100%;
      padding: 28px 28px 80px;
    }

    /* TOPO */

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 90px;
    }

    .back {
      color: var(--azul);
      text-decoration: none;
      font-size: 16px;
    }

    .top-name {
      font-size: 16px;
    }

    /* TÍTULO */

    .intro {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 70px;
    }

    h1 {
      font-size: clamp(64px, 11vw, 160px);
      font-weight: 400;
      letter-spacing: -0.06em;
      line-height: 0.85;
    }

    .info {
      align-self: end;
      max-width: 480px;
      font-size: 16px;
      line-height: 1.4;
    }

    .info p + p {
      margin-top: 18px;
    }

    .blue {
      color: var(--azul);
    }

    /* IMAGENS */

    .image-full {
      width: 100%;
      display: block;
      margin-bottom: 20px;
    }

    .maquete {
      margin-bottom: 80px;
    }

    .renders {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 80px;
    }

    .renders img {
      width: 100%;
      height: auto;
      display: block;
    }

    .renders img:first-child {
      grid-column: 1 / -1;
    }

    /* TEXTO */

    .description {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin: 100px 0;
    }

    .description-title {
      color: var(--azul);
      font-size: 16px;
    }

    .description-text {
      max-width: 620px;
      font-size: 22px;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }

    /* FINAL */

    .next {
      margin-top: 120px;
      padding-top: 25px;
      border-top: 1px solid var(--preto);

      display: flex;
      justify-content: space-between;

      font-size: 16px;
    }

    .next a {
      color: var(--azul);
      text-decoration: none;
    }


    /* CELULAR */

    @media (max-width: 700px) {

      .project {
        padding: 22px 18px 50px;
      }

      .top {
        margin-bottom: 70px;
      }

      .intro {
        grid-template-columns: 1fr;
        gap: 35px;
        margin-bottom: 45px;
      }

      h1 {
        font-size: 28vw;
      }

      .info {
        font-size: 15px;
      }

      .maquete {
        margin-bottom: 55px;
      }

      .description {
        grid-template-columns: 1fr;
        gap: 25px;
        margin: 60px 0;
      }

      .description-text {
        font-size: 19px;
      }

      .renders {
        grid-template-columns: 1fr;
        gap: 12px;
        margin-top: 55px;
      }

      .renders img:first-child {
        grid-column: auto;
      }

      .next {
        margin-top: 70px;
      }

    }

  </style>
</head>

<body>

  <main class="project">

    <header class="top">

      <a class="back" href="index.html">← voltar</a>

      <span class="top-name">Ana Luiza Campos</span>

    </header>


    <section class="intro">

      <h1>303</h1>

      <div class="info">

        <p class="blue">
          Arquitetura
        </p>

        <p>
          Escola da Cidade<br>
          São Paulo
        </p>

      </div>

    </section>


    <img
      class="image-full maquete"
      src="maquete 2 mooca .PNG"
      alt="Maquete do projeto 303"
    >


    <section class="description">

      <div class="description-title">
        ✷ sobre o projeto
      </div>

      <div class="description-text">
        <p>
          Projeto desenvolvido a partir da leitura e transformação
          de uma preexistência industrial, explorando novas relações
          entre estrutura, programa e espaço.
        </p>
      </div>

    </section>


    <section class="renders">

      <img
        src="18b5a1af-77e0-4173-a2e9-276b7a6fa937.JPG"
        alt="Projeto 303"
      >

      <img
        src="1a07f581-ac2a-40fb-886a-8bfd19d378e1.JPG"
        alt="Projeto 303"
      >

      <img
        src="35c0fb24-71bb-442e-87ef-df2ec1978967.JPG"
        alt="Projeto 303"
      >

      <img
        src="8558c32f-a82f-48c9-997e-4ee2872f9f82.JPG"
        alt="Projeto 303"
      >

    </section>


    <!--
      AQUI DEPOIS VAMOS COLOCAR:
      PLANTAS
      CORTES
      DIAGRAMAS
    -->


    <footer class="next">

      <span>303</span>

      <a href="index.html">
        voltar ao início →
      </a>

    </footer>

  </main>

</body>

</html>
