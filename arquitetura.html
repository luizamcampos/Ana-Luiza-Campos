<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arquitetura — Ana Luiza Campos</title>

  <style>

    @font-face {
      font-family: "Neue Montreal";
      src: url("./NeueMontreal-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --fundo: #ffffff;
      --preto: #111111;
      --azul: #2455ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--fundo);
      color: var(--preto);
      font-family: "Neue Montreal", sans-serif;
    }


    /* PÁGINA */

    .page {
      width: 100%;
    }


    /* TOPO */

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 28px 28px 0;
    }

    .back {
      color: var(--azul);
      text-decoration: none;
      font-size: 16px;
    }

    .top-name {
      font-size: 16px;
    }


    /* TÍTULO ARQUITETURA */

    .architecture-title {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 72px 28px 34px;
    }

    .architecture-title img {
      width: clamp(340px, 41vw, 570px);
      max-width: 84vw;

      height: auto;
      display: block;
    }


    /* PROJETOS */

    .projects {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 0;
    }


    /* CAPA DOS PROJETOS */

    .project-card {
      position: relative;

      width: 100%;
      height: 500px;

      display: block;
      overflow: hidden;

      text-decoration: none;
      color: #ffffff;

      background: #111111;
    }


    /* IMAGENS */

    .project-card img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
      object-position: center;

      transition: transform 0.7s ease;

      transform: scale(1);
    }


    /* 303 */

    .project-card.projeto-303 img {
      object-position: center center;
      filter: grayscale(100%);
    }


    /* CONJUNTO EM DESNÍVEL */

    .project-card.salvador img {
      object-position: center 79%;
    }


    /* CAMINHOS SOBRE A ÁGUA */

    .project-card.caminhos-agua img {
      object-position: center center;
    }


    /* OFICINA BRESTOL */

    .project-card.oficina-brestol img {
      object-position: center center;
    }


    /* ESCURECIMENTO */

    .project-card::after {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 1;

      background: rgba(0, 0, 0, 0.42);

      opacity: 0;

      transition: opacity 0.45s ease;
    }


    /* INFORMAÇÕES CENTRALIZADAS */

    .project-info {
      position: absolute;

      top: 50%;
      left: 50%;

      z-index: 2;

      transform:
        translate(-50%, calc(-50% + 14px));

      width: 100%;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      opacity: 0;

      transition:
        opacity 0.45s ease,
        transform 0.45s ease;

      pointer-events: none;
    }


    .project-year {
      font-size: 16px;
      margin-bottom: 13px;
    }

    .project-name {
      font-size: clamp(48px, 6.5vw, 92px);

      line-height: 0.95;

      font-weight: 400;

      letter-spacing: -0.04em;
    }

    .project-type {
      margin-top: 14px;
      font-size: 15px;
    }


    /* HOVER */

    @media (hover: hover) {

      .project-card:hover img {
        transform: scale(1.025);
      }

      .project-card:hover::after {
        opacity: 1;
      }

      .project-card:hover .project-info {
        opacity: 1;

        transform:
          translate(-50%, -50%);
      }

    }


    /* FINAL */

    .footer-wrap {
      padding: 0 28px 70px;
    }

    .footer {
      margin-top: 100px;
      padding-top: 24px;

      border-top: 1px solid var(--preto);

      display: flex;
      justify-content: space-between;

      font-size: 16px;
    }

    .footer a {
      color: var(--azul);
      text-decoration: none;
    }

    .copyright {
      margin-top: 34px;

      text-align: center;

      font-size: 11px;

      color: rgba(17, 17, 17, 0.32);
    }


    /* CELULAR */

    @media (max-width: 700px) {

      .top {
        padding: 22px 18px 0;
      }

      .back {
        font-size: 15px;
      }

      .top-name {
        font-size: 15px;
      }


      /* TÍTULO */

      .architecture-title {
        padding: 68px 18px 30px;
      }

      .architecture-title img {
        width: 78vw;
        max-width: 390px;
      }


      /* CAPAS */

      .project-card {
        width: 100%;
        height: 280px;
      }

      .project-card img {
        width: 100%;
        height: 100%;

        object-fit: cover;
      }


      /* 303 */

      .project-card.projeto-303 img {
        object-position: center center;
      }


      /* SALVADOR */

      .project-card.salvador img {
        object-position: center 79%;
      }


      /* CAMINHOS SOBRE A ÁGUA */

      .project-card.caminhos-agua img {
        object-position: center center;
      }


      /* OFICINA BRESTOL */

      .project-card.oficina-brestol img {
        object-position: center center;
      }


      /* PRIMEIRO TOQUE MOSTRA */

      .project-card.mobile-active::after {
        opacity: 1;
      }

      .project-card.mobile-active .project-info {
        opacity: 1;

        transform:
          translate(-50%, -50%);
      }


      /* INFO CENTRAL */

      .project-info {
        top: 50%;
        left: 50%;

        width: 92%;

        transform:
          translate(-50%, calc(-50% + 12px));
      }

      .project-year {
        font-size: 14px;

        margin-bottom: 9px;
      }

      .project-name {
        font-size: 11vw;

        line-height: 0.95;
      }

      .project-type {
        margin-top: 10px;

        font-size: 14px;
      }


      /* FINAL */

      .footer-wrap {
        padding: 0 18px 50px;
      }

      .footer {
        margin-top: 70px;

        font-size: 15px;
      }

      .copyright {
        margin-top: 28px;

        font-size: 10px;
      }

    }

  </style>
</head>


<body id="top">

  <main class="page">


    <!-- TOPO -->

    <header class="top">

      <a
        class="back"
        href="index.html"
      >
        ← voltar
      </a>

      <span class="top-name">
        Ana Luiza Campos
      </span>

    </header>


    <!-- TÍTULO -->

    <div class="architecture-title">

      <img
        src="3AC01354-BA4C-4201-9719-851DF4A1384B.png"
        alt="Arquitetura"
      >

    </div>


    <!-- PROJETOS -->

    <section class="projects">


      <!-- 303 -->

      <a
        class="project-card projeto-303"
        href="303.html"
      >

        <img
          src="8558c32f-a82f-48c9-997e-4ee2872f9f82.JPG"
          alt="Projeto 303"
        >

        <div class="project-info">

          <span class="project-year">
            2026
          </span>

          <span class="project-name">
            303
          </span>

          <span class="project-type">
            Projeto acadêmico
          </span>

        </div>

      </a>


      <!-- CONJUNTO EM DESNÍVEL -->

      <a
        class="project-card salvador"
        href="salvador.html"
      >

        <img
          src="foto 3 salvador.png"
          alt="Conjunto em Desnível"
        >

        <div class="project-info">

          <span class="project-year">
            2025
          </span>

          <span class="project-name">
            Conjunto em Desnível
          </span>

          <span class="project-type">
            Projeto acadêmico
          </span>

        </div>

      </a>


      <!-- CAMINHOS SOBRE A ÁGUA -->

      <a
        class="project-card caminhos-agua"
        href="caminhos-agua.html"
      >

        <img
          src="foto 1.jpg"
          alt="Caminhos sobre a Água"
        >

        <div class="project-info">

          <span class="project-year">
            2025
          </span>

          <span class="project-name">
            Caminhos sobre a Água
          </span>

          <span class="project-type">
            19ª Semana Internacional
          </span>

        </div>

      </a>


      <!-- OFICINA BRESTOL -->

      <a
        class="project-card oficina-brestol"
        href="oficina-brestol.html"
      >

        <img
          src="ev 1_page-0001.jpg"
          alt="Oficina Brestol"
        >

        <div class="project-info">

          <span class="project-year">
            2025
          </span>

          <span class="project-name">
            Oficina Brestol
          </span>

          <span class="project-type">
            Projeto acadêmico
          </span>

        </div>

      </a>


    </section>


    <!-- FINAL -->

    <div class="footer-wrap">

      <footer>

        <div class="footer">

          <span>
            Arquitetura
          </span>

          <a href="#top">
            Back to top ↑
          </a>

        </div>


        <div class="copyright">
          Ana Luiza Campos ©️ 2026
        </div>

      </footer>

    </div>


  </main>


  <script>

    /*
      CELULAR:
      PRIMEIRO TOQUE = MOSTRA INFORMAÇÕES
      SEGUNDO TOQUE = ABRE PROJETO
    */

    const cards =
      document.querySelectorAll(
        ".project-card"
      );


    cards.forEach((card) => {

      card.addEventListener(
        "click",
        function(event) {

          if (
            window.matchMedia("(hover: none)").matches
          ) {

            if (
              !card.classList.contains("mobile-active")
            ) {

              event.preventDefault();


              cards.forEach((otherCard) => {

                if (otherCard !== card) {

                  otherCard.classList.remove(
                    "mobile-active"
                  );

                }

              });


              card.classList.add(
                "mobile-active"
              );

            }

          }

        }
      );

    });

  </script>

</body>

</html>
