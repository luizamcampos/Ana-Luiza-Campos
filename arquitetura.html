<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arquitetura — Ana Luiza Campos</title>

  <style>

    @font-face {
      font-family: "Neue Montreal";
      src: url("./NeueMontreal-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --fundo: #ffffff;
      --preto: #111111;
      --azul: #2455ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--fundo);
      color: var(--preto);
      font-family: "Neue Montreal", sans-serif;
    }


    /* PÁGINA */

    .page {
      width: 100%;
    }


    /* TOPO */

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 28px 28px 0;
    }

    .back {
      color: var(--azul);
      text-decoration: none;

      font-size: 16px;
    }

    .top-name {
      font-size: 16px;
    }


    /* TÍTULO ARQUITETURA */

    .architecture-title {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 85px 28px 45px;
    }

    .architecture-title img {
      width: clamp(260px, 34vw, 470px);
      max-width: 80vw;

      height: auto;

      display: block;
    }


    /* PROJETOS */

    .projects {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 0;
    }


    /* CAPA DO PROJETO */

    .project-card {
      position: relative;

      width: 100%;

      display: block;

      overflow: hidden;

      text-decoration: none;

      color: #ffffff;

      background: #111111;
    }


    /* IMAGEM */

    .project-card img {
      width: 100%;
      height: auto;

      display: block;

      transition:
        transform 0.7s ease,
        filter 0.5s ease;

      transform: scale(1);
    }


    /* CAMADA ESCURA */

    .project-card::after {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 1;

      background: rgba(0, 0, 0, 0.42);

      opacity: 0;

      transition: opacity 0.45s ease;
    }


    /* INFORMAÇÕES */

    .project-info {
      position: absolute;

      left: 38px;
      bottom: 36px;

      z-index: 2;

      display: flex;
      flex-direction: column;
      align-items: flex-start;

      opacity: 0;

      transform: translateY(14px);

      transition:
        opacity 0.45s ease,
        transform 0.45s ease;

      pointer-events: none;
    }


    .project-year {
      font-size: 16px;

      margin-bottom: 10px;
    }

    .project-name {
      font-size: clamp(42px, 6vw, 88px);

      line-height: 0.95;

      font-weight: 400;

      letter-spacing: -0.04em;
    }

    .project-type {
      margin-top: 13px;

      font-size: 15px;
    }


    /* HOVER NO COMPUTADOR */

    @media (hover: hover) {

      .project-card:hover img {
        transform: scale(1.025);
      }

      .project-card:hover::after {
        opacity: 1;
      }

      .project-card:hover .project-info {
        opacity: 1;
        transform: translateY(0);
      }

    }


    /* FINAL */

    .footer-wrap {
      padding: 0 28px 70px;
    }

    .footer {
      margin-top: 100px;
      padding-top: 24px;

      border-top: 1px solid var(--preto);

      display: flex;
      justify-content: space-between;

      font-size: 16px;
    }

    .footer a {
      color: var(--azul);

      text-decoration: none;
    }

    .copyright {
      margin-top: 34px;

      text-align: center;

      font-size: 11px;

      color: rgba(17, 17, 17, 0.32);
    }


    /* CELULAR */

    @media (max-width: 700px) {

      .top {
        padding: 22px 18px 0;
      }

      .back {
        font-size: 15px;
      }

      .top-name {
        font-size: 15px;
      }


      /* TÍTULO */

      .architecture-title {
        padding: 75px 18px 35px;
      }

      .architecture-title img {
        width: 70vw;
        max-width: 340px;
      }


      /* CAPAS */

      .project-card {
        width: 100%;
      }

      .project-card img {
        width: 100%;
        height: auto;
      }


      /*
        NO CELULAR NÃO EXISTE HOVER.
        ENTÃO A CAPA CONTINUA LIMPA.
        O PRIMEIRO TOQUE REVELA AS INFOS,
        O SEGUNDO ABRE O PROJETO.
      */

      .project-card.mobile-active::after {
        opacity: 1;
      }

      .project-card.mobile-active .project-info {
        opacity: 1;

        transform: translateY(0);
      }


      .project-info {
        left: 20px;
        bottom: 20px;
      }

      .project-year {
        font-size: 13px;

        margin-bottom: 7px;
      }

      .project-name {
        font-size: 12vw;
      }

      .project-type {
        margin-top: 8px;

        font-size: 13px;
      }


      /* FINAL */

      .footer-wrap {
        padding: 0 18px 50px;
      }

      .footer {
        margin-top: 70px;

        font-size: 15px;
      }

      .copyright {
        margin-top: 28px;

        font-size: 10px;
      }

    }

  </style>
</head>


<body id="top">

  <main class="page">


    <!-- TOPO -->

    <header class="top">

      <a
        class="back"
        href="index.html"
      >
        ← voltar
      </a>

      <span class="top-name">
        Ana Luiza Campos
      </span>

    </header>


    <!-- TÍTULO -->

    <div class="architecture-title">

      <img
        src="3AC01354-BA4C-4201-9719-851DF4A1384B.png"
        alt="Arquitetura"
      >

    </div>


    <!-- PROJETOS -->

    <section class="projects">


      <!-- 303 -->

      <a
        class="project-card"
        href="303.html"
      >

        <img
          src="maquete 2 mooca .PNG"
          alt="Projeto 303"
        >


        <div class="project-info">

          <span class="project-year">
            2026
          </span>

          <span class="project-name">
            303
          </span>

          <span class="project-type">
            Projeto acadêmico
          </span>

        </div>

      </a>


      <!--
        OS PRÓXIMOS PROJETOS
        VÃO ENTRAR AQUI
        UM EMBAIXO DO OUTRO
      -->


    </section>


    <!-- FINAL -->

    <div class="footer-wrap">

      <footer>

        <div class="footer">

          <span>
            Arquitetura
          </span>

          <a href="#top">
            Back to top ↑
          </a>

        </div>


        <div class="copyright">
          Ana Luiza Campos © 2026
        </div>

      </footer>

    </div>


  </main>


  <script>

    /*
      NO CELULAR:
      PRIMEIRO TOQUE = MOSTRA AS INFORMAÇÕES
      SEGUNDO TOQUE = ABRE O PROJETO
    */

    const cards =
      document.querySelectorAll(".project-card");


    cards.forEach((card) => {

      card.addEventListener(
        "click",
        function(event) {

          if (
            window.matchMedia("(hover: none)").matches
          ) {

            if (
              !card.classList.contains("mobile-active")
            ) {

              event.preventDefault();


              cards.forEach((otherCard) => {

                if (otherCard !== card) {

                  otherCard.classList.remove(
                    "mobile-active"
                  );

                }

              });


              card.classList.add(
                "mobile-active"
              );

            }

          }

        }
      );

    });

  </script>

</body>

</html>
