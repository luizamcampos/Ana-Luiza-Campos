<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Portfólio de Ana Luiza Campos — Arquitetura e Social Media"
  >

  <title>Ana Luiza Campos</title>

  <style>

    :root {
      --fundo: #F3F2EA;
      --preto: #111111;
      --azul: #1647FF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--fundo);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--preto);
    }


    /* HOME */

    .home {
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      flex-direction: column;
      align-items: center;

      position: relative;

      padding:
        max(105px, env(safe-area-inset-top))
        20px
        max(90px, env(safe-area-inset-bottom));

      overflow: hidden;
    }


    /* CONTEÚDO CENTRAL */

    .conteudo {
      width: 100%;
      max-width: 760px;

      display: flex;
      flex-direction: column;
      align-items: center;

      margin-top: 8vh;
    }


    /* ESPIRAL */

    .spiral {
      width: 92px;
      height: 92px;

      margin-bottom: 27px;
    }

    .spiral svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .spiral path {
      fill: none;

      /*
        Quase da mesma cor do fundo:
        é isso que cria o efeito de relevo.
      */
      stroke: #F1F0E7;

      stroke-width: 5.5;
      stroke-linecap: round;
      stroke-linejoin: round;

      filter:
        drop-shadow(-2px -2px 1.5px rgba(255,255,255,.95))
        drop-shadow(2px 2px 1.8px rgba(119,116,104,.32));
    }


    /* NOME */

    .nome {
      font-family: "Times New Roman", Times, serif;

      font-size: clamp(25px, 6vw, 42px);
      font-weight: 400;

      letter-spacing: 0.035em;
      line-height: 1;

      color: var(--preto);

      white-space: nowrap;

      margin-bottom: 50px;

      text-align: center;
    }


    /* MENU */

    .menu {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 31px;
    }

    .menu a {
      position: relative;

      width: 100%;
      max-width: 330px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
      font-weight: 400;

      color: var(--preto);

      text-decoration: none;

      transition: opacity .2s ease;
    }

    .menu a:hover {
      opacity: .55;
    }


    /*
      O símbolo é absoluto de propósito.
      Assim ele NÃO interfere no centro da palavra.
    */

    .simbolo {
      position: absolute;

      left: 48px;

      width: 26px;

      color: var(--azul);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 21px;
      font-weight: 400;

      line-height: 1;

      text-align: center;
    }


    /* REDES SOCIAIS */

    .redes {
      position: absolute;

      bottom: max(42px, env(safe-area-inset-bottom));

      left: 50%;
      transform: translateX(-50%);

      display: flex;
      align-items: center;

      gap: 27px;
    }

    .redes a {
      color: var(--azul);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      font-weight: 400;

      text-decoration: none;

      transition: opacity .2s ease;
    }

    .redes a:hover {
      opacity: .55;
    }


    /* CELULAR */

    @media (max-width: 480px) {

      .conteudo {
        margin-top: 7vh;
      }

      .spiral {
        width: 88px;
        height: 88px;

        margin-bottom: 25px;
      }

      .nome {
        font-size: 6.2vw;

        letter-spacing: 0.025em;

        margin-bottom: 48px;
      }

      .menu {
        gap: 31px;
      }

      .menu a {
        max-width: 300px;

        font-size: 18px;
      }

      .simbolo {
        left: 38px;
      }

    }


    /* TELAS MUITO PEQUENAS */

    @media (max-width: 350px) {

      .nome {
        font-size: 5.9vw;
      }

      .menu a {
        max-width: 280px;
      }

      .simbolo {
        left: 30px;
      }

    }

  </style>
</head>


<body>

  <main class="home">

    <section class="conteudo">


      <!-- ESPIRAL ORGÂNICA EM RELEVO -->

      <div class="spiral" aria-hidden="true">

        <svg
          viewBox="0 0 120 120"
          xmlns="http://www.w3.org/2000/svg"
        >

          <path
            d="
              M 98 68

              C 96 91,
                75 105,
                51 101

              C 25 97,
                13 75,
                19 51

              C 25 28,
                48 16,
                72 22

              C 94 28,
                105 48,
                98 68

              C 92 87,
                72 94,
                54 88

              C 37 82,
                30 66,
                35 51

              C 40 37,
                55 31,
                69 36

              C 82 41,
                88 54,
                83 66

              C 79 77,
                67 81,
                57 76

              C 48 72,
                45 62,
                49 54

              C 53 47,
                61 45,
                67 49

              C 73 53,
                74 60,
                70 65

              C 66 69,
                60 68,
                58 64
            "
          />

        </svg>

      </div>


      <!-- NOME -->

      <h1 class="nome">
        ANA LUIZA CAMPOS
      </h1>


      <!-- MENU -->

      <nav class="menu">

        <a href="#arquitetura">
          <span class="simbolo">+</span>
          <span>arquitetura</span>
        </a>

        <a href="#social-media">
          <span class="simbolo">°</span>
          <span>social media</span>
        </a>

        <a href="#curriculo">
          <span class="simbolo">*</span>
          <span>currículo</span>
        </a>

        <a href="#contato">
          <span class="simbolo">—</span>
          <span>contato</span>
        </a>

      </nav>

    </section>


    <!-- REDES -->

    <div class="redes">

      <a href="#" aria-label="LinkedIn">
        in
      </a>

      <a href="#" aria-label="Instagram">
        ig
      </a>

      <a href="mailto:seuemail@email.com" aria-label="E-mail">
        @
      </a>

    </div>

  </main>

</body>
</html>
