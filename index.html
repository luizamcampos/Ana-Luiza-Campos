<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ana Luiza Campos</title>

  <style>

    /* NEUE MONTREAL */

    @font-face {
      font-family: "Neue Montreal";
      src: url("./NeueMontreal-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }


    /* CORES */

    :root {
      --fundo: #f3f2ed;
      --preto: #111111;
      --azul: #2455ff;
    }


    /* RESET */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: var(--fundo);
      color: var(--preto);
    }


    /* HOME */

    .home {
      min-height: 100svh;
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      position: relative;

      padding: 50px 22px 95px;
    }


    /* BLOCO PRINCIPAL */

    .conteudo {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      transform: translateY(-12px);
    }


    /* ESPIRAL */

    .spiral {
      width: 88px;
      height: 88px;

      object-fit: contain;
      display: block;

      margin-bottom: 18px;
    }


    /* LOGO ANA LUIZA CAMPOS */

    .name-logo {
      width: min(480px, 66vw);
      height: auto;

      object-fit: contain;
      display: block;

      margin-bottom: 38px;
    }


    /* MENU */

    .menu {
      display: flex;
      flex-direction: column;

      align-items: flex-start;

      gap: 28px;
    }

    .menu-item {
      display: grid;

      grid-template-columns: 42px auto;

      align-items: center;

      color: var(--preto);
      text-decoration: none;

      font-family: "Neue Montreal", Arial, sans-serif;

      font-size: 25px;
      font-weight: 400;

      letter-spacing: -0.03em;

      transition: opacity 0.2s ease;
    }

    .menu-item:hover {
      opacity: 0.55;
    }


    /* ESTRELINHAS */

    .symbol {
      color: var(--azul);

      font-family: Arial, sans-serif;

      font-size: 22px;

      line-height: 1;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* LINKS DE CONTATO */

    .social {
      position: absolute;

      bottom: 52px;
      left: 50%;

      transform: translateX(-50%);

      display: flex;
      align-items: center;

      gap: 34px;
    }

    .social a {
      color: var(--azul);

      text-decoration: none;

      font-family: "Neue Montreal", Arial, sans-serif;

      font-size: 18px;
      font-weight: 400;
    }


    /* CELULAR */

    @media (max-width: 600px) {

      .conteudo {
        transform: translateY(-15px);
      }

      .spiral {
        width: 82px;
        height: 82px;

        margin-bottom: 16px;
      }

      .name-logo {
        width: 66vw;

        max-width: 380px;

        margin-bottom: 36px;
      }

      .menu {
        gap: 27px;
      }

      .menu-item {
        grid-template-columns: 40px auto;

        font-size: 23px;
      }

      .symbol {
        font-size: 21px;
      }

      .social {
        bottom: 55px;

        gap: 32px;
      }

      .social a {
        font-size: 17px;
      }

    }


    @media (max-width: 390px) {

      .name-logo {
        width: 68vw;
      }

      .menu-item {
        font-size: 22px;
      }

    }

  </style>
</head>


<body>

  <main class="home">


    <section class="conteudo">


      <!-- ESPIRAL -->

      <img
        class="spiral"
        src="E4C92BBE-623D-486D-94FF-2AF7077F6DED.png"
        alt=""
      >


      <!-- LOGO ANA LUIZA CAMPOS -->

      <img
        class="name-logo"
        src="9DE4427F-D7A4-45B2-A785-B64790E32DC7.png"
        alt="Ana Luiza Campos"
      >


      <!-- MENU -->

      <nav class="menu">

        <a class="menu-item" href="#arquitetura">
          <span class="symbol">✷</span>
          <span>arquitetura</span>
        </a>

        <a class="menu-item" href="#social-media">
          <span class="symbol">✷</span>
          <span>social media</span>
        </a>

        <a class="menu-item" href="#curriculo">
          <span class="symbol">✷</span>
          <span>currículo</span>
        </a>

        <a class="menu-item" href="#contato">
          <span class="symbol">✷</span>
          <span>contato</span>
        </a>

      </nav>


    </section>


    <!-- CONTATO -->

    <div class="social">

      <a href="#" aria-label="LinkedIn">
        in
      </a>

      <a href="mailto:seuemail@email.com" aria-label="E-mail">
        @
      </a>

    </div>


  </main>

</body>

</html>
