<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Portfólio de Ana Luiza Campos — Arquitetura e Social Media"
  />

  <title>Ana Luiza Campos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,WONK@9..144,300..700,0..1&display=swap"
    rel="stylesheet"
  />

  <style>

    :root {
      --fundo: #f3efe3;
      --azul: #3150c9;
      --verde: #707a59;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--fundo);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--verde);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .home {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: 28px 30px 24px;
    }

    .topo {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
    }

    .menu-desktop {
      display: flex;
      gap: 34px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .menu-desktop a {
      transition: color 0.2s ease;
    }

    .menu-desktop a:hover {
      color: var(--azul);
    }

    .centro {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 70px 0;
    }

    .nome {
      font-family: "Fraunces", serif;
      font-size: clamp(54px, 8vw, 108px);
      line-height: 0.9;
      font-weight: 430;
      letter-spacing: -0.045em;
      color: var(--verde);
      margin-bottom: 50px;
      font-variation-settings: "WONK" 1;
    }

    .nome span {
      display: block;
    }

    .links-principais {
      display: flex;
      flex-direction: column;
      gap: 23px;
      align-items: flex-start;
      text-align: left;
      font-size: 20px;
    }

    .item {
      display: grid;
      grid-template-columns: 34px auto;
      align-items: center;
      gap: 12px;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .item:hover {
      color: var(--azul);
      transform: translateX(5px);
    }

    .simbolo {
      color: var(--azul);
      font-size: 20px;
      text-align: center;
      font-weight: 400;
    }

    .rodape {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .social {
      display: flex;
      gap: 18px;
    }

    .social a:hover {
      color: var(--azul);
    }

    .assinatura {
      text-align: right;
    }

    @media (max-width: 720px) {

      .home {
        padding: 22px 20px 20px;
      }

      .topo {
        display: none;
      }

      .centro {
        padding: 50px 0;
      }

      .nome {
        font-size: clamp(48px, 16vw, 78px);
        margin-bottom: 48px;
      }

      .links-principais {
        font-size: 19px;
        gap: 26px;
      }

      .rodape {
        margin-top: auto;
        font-size: 11px;
      }

      .assinatura {
        display: none;
      }

    }

  </style>
</head>

<body>

  <main class="home">

    <header class="topo">

      <nav class="menu-desktop">
        <a href="#arquitetura">Arquitetura</a>
        <a href="#social-media">Social Media</a>
        <a href="#curriculo">Currículo</a>
        <a href="#contato">Contato</a>
      </nav>

    </header>

    <section class="centro">

      <h1 class="nome">
        <span>ANA LUIZA</span>
        <span>CAMPOS</span>
      </h1>

      <nav class="links-principais">

        <a class="item" href="#arquitetura">
          <span class="simbolo">+</span>
          <span>arquitetura</span>
        </a>

        <a class="item" href="#social-media">
          <span class="simbolo">°</span>
          <span>social media</span>
        </a>

        <a class="item" href="#curriculo">
          <span class="simbolo">*</span>
          <span>currículo</span>
        </a>

        <a class="item" href="#contato">
          <span class="simbolo">—</span>
          <span>contato</span>
        </a>

      </nav>

    </section>

    <footer class="rodape">

      <div class="social">
        <a href="#">in</a>
        <a href="#">ig</a>
        <a href="mailto:seuemail@email.com">@</a>
      </div>

      <div class="assinatura">
        Ana Luiza Campos © 2026
      </div>

    </footer>

  </main>

</body>

</html>
