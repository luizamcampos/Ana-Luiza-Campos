<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfólio de Ana Luiza Campos">
  <title>Ana Luiza Campos</title>

  <style>
    :root {
      --fundo: #F5F3EA;
      --preto: #111111;
      --azul: #2447E5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--fundo);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--preto);
    }

    .home {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding: 70px 28px 45px;
    }

    /* ESPIRAL */
    .spiral {
      width: 82px;
      height: 82px;
      margin-bottom: 38px;
      color: var(--azul);
    }

    .spiral svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .spiral path {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* NOME */
    .nome {
      font-family: "Times New Roman", Times, serif;
      font-size: clamp(29px, 7.3vw, 50px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -1.5px;
      white-space: nowrap;
      color: var(--preto);
      margin-bottom: 65px;
    }

    /* MENU */
    .menu {
      width: 100%;
      max-width: 290px;
      display: flex;
      flex-direction: column;
      gap: 34px;
    }

    .menu a {
      display: grid;
      grid-template-columns: 45px 1fr;
      align-items: center;
      text-decoration: none;
      color: var(--preto);
      font-size: 18px;
      font-weight: 400;
      letter-spacing: -0.2px;
    }

    .simbolo {
      color: var(--azul);
      font-size: 22px;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 400;
    }

    .menu a:hover .texto {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 5px;
    }

    /* REDES */
    .redes {
      position: absolute;
      left: 28px;
      bottom: 38px;
      display: flex;
      gap: 24px;
    }

    .redes a {
      color: var(--azul);
      text-decoration: none;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .home {
        padding-top: 80px;
      }

      .spiral {
        width: 72px;
        height: 72px;
        margin-bottom: 34px;
      }

      .nome {
        font-size: 8vw;
        letter-spacing: -1.3px;
        margin-bottom: 60px;
      }

      .menu {
        max-width: 260px;
      }

      .menu a {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="home">

    <div class="spiral">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path d="
          M82 58
          C77 76, 58 87, 39 82
          C18 77, 10 54, 20 35
          C30 15, 58 10, 76 25
          C94 40, 91 67, 73 79
          C54 92, 29 84, 23 63
          C17 43, 31 25, 50 24
          C69 23, 82 38, 78 55
          C74 72, 56 79, 42 72
          C28 65, 26 47, 37 37
          C48 27, 65 32, 69 45
          C73 58, 63 68, 52 66
          C41 64, 36 53, 41 45
          C46 37, 58 39, 61 47
          C64 55, 57 60, 51 57
          C45 54, 46 48, 50 47
        "/>
      </svg>
    </div>

    <h1 class="nome">ANA LUIZA CAMPOS</h1>

    <nav class="menu">

      <a href="#arquitetura">
        <span class="simbolo">+</span>
        <span class="texto">arquitetura</span>
      </a>

      <a href="#social-media">
        <span class="simbolo">°</span>
        <span class="texto">social media</span>
      </a>

      <a href="#curriculo">
        <span class="simbolo">*</span>
        <span class="texto">currículo</span>
      </a>

      <a href="#contato">
        <span class="simbolo">—</span>
        <span class="texto">contato</span>
      </a>

    </nav>

    <div class="redes">
      <a href="#" aria-label="LinkedIn">in</a>
      <a href="#" aria-label="Instagram">ig</a>
      <a href="mailto:" aria-label="Email">@</a>
    </div>

  </main>

</body>
</html>
