<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Portfólio de Ana Luiza Campos — Arquitetura e Social Media"
  >

  <title>Ana Luiza Campos</title>

  <style>
    :root {
      --fundo: #F3F2EA;
      --preto: #111111;
      --azul: #1647FF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--fundo);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--preto);
    }

    .home {
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      flex-direction: column;
      align-items: center;

      position: relative;

      padding:
        max(105px, env(safe-area-inset-top))
        20px
        max(90px, env(safe-area-inset-bottom));

      overflow: hidden;
    }

    .conteudo {
      width: 100%;
      max-width: 760px;

      display: flex;
      flex-direction: column;
      align-items: center;

      margin-top: 7vh;
    }

    /* ESPIRAL PNG */
    .spiral {
      width: 92px;
      height: auto;

      display: block;

      margin-bottom: 26px;
    }

    .nome {
      font-family: "Times New Roman", Times, serif;

      font-size: clamp(25px, 6vw, 42px);
      font-weight: 400;

      letter-spacing: 0.035em;
      line-height: 1;

      color: var(--preto);

      white-space: nowrap;

      margin-bottom: 50px;

      text-align: center;
    }

    .menu {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 31px;
    }

    .menu a {
      position: relative;

      width: 100%;
      max-width: 330px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
      font-weight: 400;

      color: var(--preto);

      text-decoration: none;

      transition: opacity .2s ease;
    }

    .menu a:hover {
      opacity: .55;
    }

    .simbolo {
      position: absolute;
      left: 48px;

      width: 26px;

      color: var(--azul);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 21px;
      font-weight: 400;

      line-height: 1;
      text-align: center;
    }

    .redes {
      position: absolute;

      bottom: max(42px, env(safe-area-inset-bottom));

      left: 50%;
      transform: translateX(-50%);

      display: flex;
      align-items: center;

      gap: 27px;
    }

    .redes a {
      color: var(--azul);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      font-weight: 400;

      text-decoration: none;

      transition: opacity .2s ease;
    }

    .redes a:hover {
      opacity: .55;
    }

    @media (max-width: 480px) {
      .conteudo {
        margin-top: 7vh;
      }

      .spiral {
        width: 88px;
        margin-bottom: 25px;
      }

      .nome {
        font-size: 6.2vw;
        letter-spacing: 0.025em;
        margin-bottom: 48px;
      }

      .menu {
        gap: 31px;
      }

      .menu a {
        max-width: 300px;
        font-size: 18px;
      }

      .simbolo {
        left: 38px;
      }
    }

    @media (max-width: 350px) {
      .nome {
        font-size: 5.9vw;
      }

      .menu a {
        max-width: 280px;
      }

      .simbolo {
        left: 30px;
      }
    }
  </style>
</head>

<body>

  <main class="home">

    <section class="conteudo">

      <img
        src="E4C92BBE-623D-486D-94FF-2AF7077F6DED.png"
        alt=""
        class="spiral"
      >

      <h1 class="nome">
        ANA LUIZA CAMPOS
      </h1>

      <nav class="menu">

        <a href="#arquitetura">
          <span class="simbolo">+</span>
          <span>arquitetura</span>
        </a>

        <a href="#social-media">
          <span class="simbolo">°</span>
          <span>social media</span>
        </a>

        <a href="#curriculo">
          <span class="simbolo">*</span>
          <span>currículo</span>
        </a>

        <a href="#contato">
          <span class="simbolo">—</span>
          <span>contato</span>
        </a>

      </nav>

    </section>

    <div class="redes">

      <a href="#" aria-label="LinkedIn">in</a>

      <a href="#" aria-label="Instagram">ig</a>

      <a href="mailto:seuemail@email.com" aria-label="E-mail">@</a>

    </div>

  </main>

</body>
</html>
