<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ana Luiza Campos</title>

  <style>

    :root {
      --fundo: #f3f2ed;
      --preto: #111111;
      --azul: #2455ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: var(--fundo);
      color: var(--preto);
    }


    /* HOME */

    .home {
      min-height: 100svh;
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      position: relative;

      padding: 60px 24px 90px;
    }


    /* ESPIRAL */

    .spiral {
      width: 105px;
      height: 105px;

      object-fit: contain;

      display: block;

      margin-bottom: 34px;
    }


    /* NOME */

    .name {
      font-family: "Times New Roman", Times, serif;

      font-size: clamp(32px, 5vw, 54px);
      font-weight: 400;

      line-height: 1;

      letter-spacing: -0.04em;

      text-align: center;

      white-space: nowrap;

      margin-bottom: 64px;
    }


    /* MENU */

    .menu {
      display: flex;
      flex-direction: column;

      align-items: flex-start;

      gap: 38px;
    }

    .menu-item {
      display: grid;

      grid-template-columns: 45px auto;

      align-items: center;

      text-decoration: none;

      color: var(--preto);

      font-family: "Neue Montreal",
                   "Helvetica Neue",
                   Helvetica,
                   Arial,
                   sans-serif;

      font-size: 28px;
      font-weight: 400;

      letter-spacing: -0.03em;

      transition: opacity 0.2s ease;
    }

    .menu-item:hover {
      opacity: 0.55;
    }


    /* ESTRELAS */

    .symbol {
      color: var(--azul);

      font-family: Arial, sans-serif;

      font-size: 24px;
      font-weight: 400;

      line-height: 1;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* LINKS SOCIAIS */

    .social {
      position: absolute;

      bottom: 52px;
      left: 50%;

      transform: translateX(-50%);

      display: flex;
      align-items: center;

      gap: 34px;
    }

    .social a {
      color: var(--azul);

      text-decoration: none;

      font-family: "Neue Montreal",
                   "Helvetica Neue",
                   Helvetica,
                   Arial,
                   sans-serif;

      font-size: 20px;
      font-weight: 400;
    }


    /* MOBILE */

    @media (max-width: 600px) {

      .home {
        padding: 50px 22px 100px;
      }

      .spiral {
        width: 88px;
        height: 88px;

        margin-bottom: 30px;
      }

      .name {
        font-size: 34px;

        margin-bottom: 55px;
      }

      .menu {
        gap: 36px;
      }

      .menu-item {
        grid-template-columns: 42px auto;

        font-size: 25px;
      }

      .symbol {
        font-size: 22px;
      }

      .social {
        bottom: 55px;
        gap: 30px;
      }

      .social a {
        font-size: 18px;
      }
    }


    @media (max-width: 390px) {

      .name {
        font-size: 30px;
      }

      .menu-item {
        font-size: 23px;
      }

    }

  </style>
</head>


<body>

  <main class="home">

    <!-- ESPIRAL -->
    <!-- IMPORTANTE:
         troque o nome abaixo pelo nome EXATO
         do PNG que você colocou no GitHub -->

    <img
      class="spiral"
      src="E4C92BBE-623D-486D-94FF-2AF7077F6DED.png"
      alt=""
    >


    <!-- NOME -->

    <h1 class="name">
      ANA LUIZA CAMPOS
    </h1>


    <!-- MENU -->

    <nav class="menu">

      <a class="menu-item" href="#arquitetura">
        <span class="symbol">✷</span>
        <span>arquitetura</span>
      </a>

      <a class="menu-item" href="#social-media">
        <span class="symbol">✷</span>
        <span>social media</span>
      </a>

      <a class="menu-item" href="#curriculo">
        <span class="symbol">✷</span>
        <span>currículo</span>
      </a>

      <a class="menu-item" href="#contato">
        <span class="symbol">✷</span>
        <span>contato</span>
      </a>

    </nav>


    <!-- REDES -->

    <div class="social">

      <a href="#" aria-label="LinkedIn">
        in
      </a>

      <a href="#" aria-label="Instagram">
        ig
      </a>

      <a href="mailto:seuemail@email.com" aria-label="E-mail">
        @
      </a>

    </div>

  </main>

</body>

</html>
