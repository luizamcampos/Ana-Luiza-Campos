<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ana Luiza Campos</title>

  <style>

    @font-face {
      font-family: "Neue Montreal";
      src: url("NeueMontreal-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
    }

    :root {
      --fundo: #f4f3ec;
      --azul: #2450ff;
      --preto: #111111;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--fundo);
    }

    body {
      font-family: "Neue Montreal", Arial, sans-serif;
      color: var(--preto);
    }

    .home {
      min-height: 100svh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 40px 24px;
    }

    /* ESPIRAL */

    .spiral {
      width: 72px;
      height: 72px;
      object-fit: contain;
      display: block;
      margin-bottom: 30px;
    }

    /* TÍTULO EM PNG */

    .nome-img {
      width: min(440px, 82vw);
      height: auto;
      display: block;
      object-fit: contain;
      margin-bottom: 50px;
    }

    /* MENU */

    .menu {
      display: flex;
      flex-direction: column;
      gap: 27px;
      width: fit-content;
    }

    .menu a {
      display: grid;
      grid-template-columns: 30px auto;
      column-gap: 22px;
      align-items: center;

      color: var(--preto);
      text-decoration: none;

      font-family: "Neue Montreal", Arial, sans-serif;
      font-size: 21px;
      line-height: 1;
      font-weight: 400;

      transition: opacity 0.2s ease;
    }

    .menu a:hover {
      opacity: 0.55;
    }

    .simbolo {
      color: var(--azul);
      font-size: 20px;
      line-height: 1;
      text-align: center;
    }

    /* REDES SOCIAIS */

    .social {
      position: absolute;
      bottom: 42px;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      align-items: center;
      gap: 28px;
    }

    .social a {
      color: var(--azul);
      text-decoration: none;
      font-family: "Neue Montreal", Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
    }

    .social a:hover {
      opacity: 0.55;
    }

    /* CELULAR */

    @media (max-width: 600px) {

      .home {
        padding: 35px 20px 100px;
      }

      .spiral {
        width: 62px;
        height: 62px;
        margin-bottom: 26px;
      }

      .nome-img {
        width: 78vw;
        max-width: 360px;
        margin-bottom: 45px;
      }

      .menu {
        gap: 25px;
      }

      .menu a {
        grid-template-columns: 28px auto;
        column-gap: 20px;
        font-size: 19px;
      }

      .simbolo {
        font-size: 18px;
      }

      .social {
        bottom: 38px;
        gap: 26px;
      }

      .social a {
        font-size: 15px;
      }
    }

  </style>
</head>

<body>

  <main class="home">

    <!-- ESPIRAL -->
    <img
      class="spiral"
      src="E4C92BBE-623D-486D-94FF-2AF7077F6DED.png"
      alt=""
    />

    <!-- ANA LUIZA CAMPOS -->
    <img
      class="nome-img"
      src="9DE4427F-D7A4-45B2-A785-B64790E32DC7.png"
      alt="Ana Luiza Campos"
    />

    <!-- MENU -->
    <nav class="menu">

      <a href="#arquitetura">
        <span class="simbolo">✷</span>
        <span>arquitetura</span>
      </a>

      <a href="#social-media">
        <span class="simbolo">✷</span>
        <span>social media</span>
      </a>

      <a href="#curriculo">
        <span class="simbolo">✷</span>
        <span>currículo</span>
      </a>

      <a href="#contato">
        <span class="simbolo">✷</span>
        <span>contato</span>
      </a>

    </nav>

    <!-- REDES -->
    <div class="social">
      <a href="#" aria-label="LinkedIn">in</a>
      <a href="#" aria-label="Instagram">ig</a>
      <a href="mailto:" aria-label="E-mail">@</a>
    </div>

  </main>

</body>

</html>
