<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ana Luiza Campos</title>

  <style>

    @font-face {
      font-family: "Neue Montreal";
      src: url("./NeueMontreal-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --fundo: #ffffff;
      --preto: #111111;
      --azul: #2455ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: var(--fundo);
      color: var(--preto);
    }


    /* PÁGINA */

    .home {
      min-height: 100svh;
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 48px 24px 42px;
    }

    .main-content {
      width: 100%;
      max-width: 760px;

      display: flex;
      flex-direction: column;
      align-items: center;

      margin: auto 0;
    }


    /* CADEIRA */

    .chair {
      width: 105px;
      height: 105px;

      object-fit: contain;
      display: block;

      margin-bottom: 18px;
    }


    /* NOME */

    .name-image {
      width: 430px;
      max-width: 78vw;
      height: auto;

      display: block;

      margin-bottom: 32px;
    }


    /* MENU */

    .menu {
      display: flex;
      flex-direction: column;

      gap: 22px;

      align-items: flex-start;
    }

    .menu-item {
      display: grid;

      grid-template-columns: 34px auto;

      align-items: center;

      text-decoration: none;
      color: var(--preto);

      font-family: "Neue Montreal", sans-serif;

      font-size: 22px;
      font-weight: 400;

      letter-spacing: -0.02em;

      transition: opacity 0.2s ease;
    }

    .menu-item:hover {
      opacity: 0.55;
    }

    .symbol {
      color: var(--azul);

      font-family: "Neue Montreal", sans-serif;

      font-size: 20px;
      font-weight: 400;

      line-height: 1;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* CONTATOS */

    .social {
      width: 330px;
      max-width: 64vw;

      display: grid;
      grid-template-columns: 1fr 1fr 1fr;

      align-items: center;

      margin-top: 78px;

      position: relative;
    }


    /* BOTÃO DOS ÍCONES */

    .social-link {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      color: var(--azul);

      text-decoration: none;

      font-family: "Neue Montreal", sans-serif;

      font-size: 17px;
      font-weight: 400;

      line-height: 1;

      background: transparent;
      border: 0;

      cursor: pointer;

      transition:
        background-color 0.22s ease,
        color 0.22s ease,
        transform 0.22s ease;
    }


    /* POSIÇÕES */

    .linkedin {
      justify-self: start;
    }

    .email {
      justify-self: center;
    }

    .phone-wrapper {
      justify-self: end;

      position: relative;
    }


    /* TELEFONE */

    .phone svg {
      width: 18px;
      height: 18px;

      display: block;

      fill: none;
      stroke: currentColor;

      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }


    /* HOVER */

    @media (hover: hover) {

      .social-link:hover {
        background: var(--azul);
        color: #ffffff;

        transform: scale(1.06);
      }

    }


    /* MENU TELEFONE */

    .phone-menu {
      position: absolute;

      right: 0;
      bottom: 50px;

      min-width: 135px;

      display: flex;
      flex-direction: column;

      background: #ffffff;

      border: 1px solid rgba(17, 17, 17, 0.16);

      padding: 6px;

      opacity: 0;
      visibility: hidden;

      transform: translateY(8px);

      transition:
        opacity 0.2s ease,
        visibility 0.2s ease,
        transform 0.2s ease;

      z-index: 20;
    }

    .phone-wrapper.active .phone-menu {
      opacity: 1;
      visibility: visible;

      transform: translateY(0);
    }


    /* OPÇÕES */

    .phone-option {
      display: block;

      padding: 10px 12px;

      color: var(--preto);

      text-decoration: none;

      font-family: "Neue Montreal", sans-serif;
      font-size: 14px;

      white-space: nowrap;

      transition:
        background-color 0.2s ease,
        color 0.2s ease;
    }

    @media (hover: hover) {

      .phone-option:hover {
        background: var(--azul);
        color: #ffffff;
      }

    }


    /* CELULAR */

    @media (max-width: 600px) {

      .home {
        min-height: 100svh;

        padding: 44px 22px 52px;
      }

      .main-content {
        margin: auto 0;
      }


      /* CADEIRA */

      .chair {
        width: 88px;
        height: 88px;

        margin-bottom: 18px;
      }


      /* NOME */

      .name-image {
        width: 390px;
        max-width: 74vw;

        margin-bottom: 32px;
      }


      /* MENU */

      .menu {
        gap: 24px;
      }

      .menu-item {
        grid-template-columns: 34px auto;

        font-size: 20px;
      }

      .symbol {
        font-size: 19px;
      }


      /* CONTATOS */

      .social {
        width: 300px;
        max-width: 62vw;

        margin-top: 82px;
      }

      .social-link {
        width: 40px;
        height: 40px;

        font-size: 17px;
      }

      .phone svg {
        width: 19px;
        height: 19px;
      }


      /* MENU DO TELEFONE */

      .phone-menu {
        bottom: 52px;

        min-width: 140px;
      }

      .phone-option {
        padding: 11px 12px;

        font-size: 15px;
      }

    }


    /* COMPUTADOR */

    @media (min-width: 900px) {

      .home {
        padding-top: 40px;
        padding-bottom: 40px;
      }

      .main-content {
        margin: auto 0;
      }


      /* CADEIRA */

      .chair {
        width: 92px;
        height: 92px;

        margin-bottom: 12px;
      }


      /* NOME */

      .name-image {
        width: 360px;
        max-width: 32vw;

        margin-bottom: 24px;
      }


      /* MENU */

      .menu {
        gap: 16px;
      }

      .menu-item {
        font-size: 16px;

        grid-template-columns: 28px auto;
      }

      .symbol {
        font-size: 16px;
      }


      /* CONTATOS */

      .social {
        width: 275px;
        max-width: 27vw;

        margin-top: 58px;
      }

      .social-link {
        width: 34px;
        height: 34px;

        font-size: 14px;
      }

      .phone svg {
        width: 16px;
        height: 16px;
      }

      .phone-menu {
        bottom: 46px;
      }

    }

  </style>
</head>


<body>

  <main class="home">

    <section class="main-content">


      <!-- CADEIRA -->

      <img
        class="chair"
        src="2A5B9B10-F496-40D4-8B24-48520B840813.png"
        alt=""
      >


      <!-- NOME -->

      <img
        class="name-image"
        src="9DE4427F-D7A4-45B2-A785-B64790E32DC7.png"
        alt="Ana Luiza Campos"
      >


      <!-- MENU -->

      <nav class="menu">

        <a
          class="menu-item"
          href="arquitetura.html"
        >

          <span class="symbol">
            ✷
          </span>

          <span>
            arquitetura
          </span>

        </a>


        <a
          class="menu-item"
          href="#social-media"
        >

          <span class="symbol">
            ✷
          </span>

          <span>
            social media
          </span>

        </a>


        <a
          class="menu-item"
          href="curriculo.html"
        >

          <span class="symbol">
            ✷
          </span>

          <span>
            currículo
          </span>

        </a>

      </nav>


      <!-- CONTATOS -->

      <div class="social">


        <!-- LINKEDIN -->

        <a
          class="social-link linkedin"
          href="https://www.linkedin.com/in/ana-luiza-campos-b55429319"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn"
        >
          in
        </a>


        <!-- EMAIL -->

        <a
          class="social-link email"
          href="mailto:Analuizacamposarq@outlook.com"
          aria-label="Enviar e-mail"
        >
          @
        </a>


        <!-- TELEFONE / WHATSAPP -->

        <div
          class="phone-wrapper"
          id="phoneWrapper"
        >

          <button
            class="social-link phone"
            id="phoneButton"
            type="button"
            aria-label="Contato por telefone ou WhatsApp"
            aria-expanded="false"
          >

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >

              <path
                d="M7.2 3.5
                   L9.4 8.2
                   C9.7 8.8 9.5 9.5 9 9.9
                   L7.7 11
                   C8.8 13.2 10.8 15.2 13 16.3
                   L14.1 15
                   C14.5 14.5 15.2 14.3 15.8 14.6
                   L20.5 16.8
                   C21.2 17.1 21.5 17.8 21.3 18.5
                   C20.8 20.2 19.2 21.2 17.4 21
                   C9.7 20.1 3.9 14.3 3 6.6
                   C2.8 4.8 3.8 3.2 5.5 2.7
                   C6.2 2.5 6.9 2.8 7.2 3.5Z"
              />

            </svg>

          </button>


          <!-- ESCOLHA DE CONTATO -->

          <div
            class="phone-menu"
            id="phoneMenu"
          >

            <a
              class="phone-option"
              href="tel:+5511981279814"
            >
              Ligar
            </a>

            <a
              class="phone-option"
              href="https://wa.me/5511981279814"
              target="_blank"
              rel="noopener noreferrer"
            >
              WhatsApp
            </a>

          </div>

        </div>


      </div>

    </section>

  </main>


  <!-- TELEFONE MENU -->

  <script>

    const phoneWrapper =
      document.getElementById("phoneWrapper");

    const phoneButton =
      document.getElementById("phoneButton");


    phoneButton.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        const isActive =
          phoneWrapper.classList.toggle(
            "active"
          );

        phoneButton.setAttribute(
          "aria-expanded",
          isActive
        );

      }
    );


    document.addEventListener(
      "click",
      function(event) {

        if (
          !phoneWrapper.contains(
            event.target
          )
        ) {

          phoneWrapper.classList.remove(
            "active"
          );

          phoneButton.setAttribute(
            "aria-expanded",
            "false"
          );

        }

      }
    );


    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape"
        ) {

          phoneWrapper.classList.remove(
            "active"
          );

          phoneButton.setAttribute(
            "aria-expanded",
            "false"
          );

        }

      }
    );

  </script>

</body>

</html>
