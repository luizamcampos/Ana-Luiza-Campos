<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Portfólio de Ana Luiza Campos"
  />

  <title>Ana Luiza Campos</title>

  <style>

    @font-face {
      font-family: "Neue Montreal";
      src: url("NeueMontreal-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
    }

    :root {
      --fundo: #f5f3eb;
      --preto: #111111;
      --azul: #2455ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: var(--fundo);
      color: var(--preto);
      font-family: "Neue Montreal", Arial, sans-serif;
    }

    .pagina {
      min-height: 100svh;
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 40px 24px 34px;
    }


    /* BLOCO PRINCIPAL */

    .principal {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      transform: translateY(-10px);
    }


    /* ESPIRAL */

    .espiral {
      width: 82px;
      height: auto;
      display: block;

      margin-bottom: 26px;
    }


    /* TÍTULO EM PNG */

    .titulo {
      width: min(510px, 78vw);
      height: auto;
      display: block;

      margin-bottom: 42px;
    }


    /* MENU */

    .menu {
      display: flex;
      flex-direction: column;

      gap: 24px;

      width: fit-content;
    }

    .menu a {
      display: grid;

      grid-template-columns: 30px auto;

      align-items: center;
      column-gap: 18px;

      text-decoration: none;
      color: var(--preto);

      font-family: "Neue Montreal", Arial, sans-serif;
      font-size: 22px;
      font-weight: 400;
      line-height: 1;

      white-space: nowrap;
    }

    .estrela {
      color: var(--azul);

      font-size: 22px;
      line-height: 1;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* REDES */

    .redes {
      position: absolute;

      bottom: 48px;
      left: 50%;

      transform: translateX(-50%);

      display: flex;
      align-items: center;
      gap: 34px;
    }

    .redes a {
      color: var(--azul);
      text-decoration: none;

      font-family: "Neue Montreal", Arial, sans-serif;
      font-size: 18px;
      font-weight: 400;
    }


    /* CELULAR */

    @media (max-width: 600px) {

      .pagina {
        position: relative;

        min-height: 100svh;

        justify-content: center;

        padding: 30px 20px 32px;
      }

      .principal {
        transform: translateY(-25px);
      }

      .espiral {
        width: 72px;

        margin-bottom: 22px;
      }

      .titulo {
        width: 72vw;
        max-width: 390px;

        margin-bottom: 36px;
      }

      .menu {
        gap: 22px;
      }

      .menu a {
        grid-template-columns: 26px auto;

        column-gap: 17px;

        font-size: 19px;
      }

      .estrela {
        font-size: 20px;
      }

      .redes {
        bottom: 48px;
        gap: 36px;
      }

      .redes a {
        font-size: 17px;
      }
    }

  </style>
</head>


<body>

  <main class="pagina">

    <section class="principal">

      <!-- ESPIRAL -->

      <img
        class="espiral"
        src="E4C92BBE-623D-486D-94FF-2AF7077F6DED.png"
        alt=""
      />


      <!-- ANA LUIZA CAMPOS -->

      <img
        class="titulo"
        src="9DE4427F-D7A4-45B2-A785-B64790E32DC7.png"
        alt="Ana Luiza Campos"
      />


      <!-- MENU -->

      <nav class="menu">

        <a href="#arquitetura">
          <span class="estrela">✷</span>
          <span>arquitetura</span>
        </a>

        <a href="#social-media">
          <span class="estrela">✷</span>
          <span>social media</span>
        </a>

        <a href="#curriculo">
          <span class="estrela">✷</span>
          <span>currículo</span>
        </a>

        <a href="#contato">
          <span class="estrela">✷</span>
          <span>contato</span>
        </a>

      </nav>

    </section>


    <!-- LINKS INFERIORES -->

    <div class="redes">

      <a
        href="#"
        aria-label="LinkedIn"
      >
        in
      </a>

      <a
        href="mailto:SEUEMAIL@EMAIL.COM"
        aria-label="E-mail"
      >
        @
      </a>

    </div>

  </main>

</body>

</html>
