<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfólio de Ana Luiza Campos">
  <title>Ana Luiza Campos</title>

  <style>
    :root {
      --fundo: #F4F2E8;
      --preto: #111111;
      --azul: #2146E0;
      --relevo-claro: rgba(255,255,255,0.9);
      --relevo-escuro: rgba(120,115,100,0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--fundo);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--preto);
    }

    .home {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 70px 24px 90px;
      text-align: center;
    }

    .conteudo {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ESPIRAL EM RELEVO */
    .spiral {
      width: 92px;
      height: 92px;
      margin-bottom: 34px;
      position: relative;
    }

    .spiral svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .spiral path {
      fill: none;
      stroke: var(--fundo);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;

      filter:
        drop-shadow(-1.5px -1.5px 1.5px var(--relevo-claro))
        drop-shadow(1.7px 1.7px 1.5px var(--relevo-escuro));
    }

    /* NOME */
    .nome {
      font-family: "Times New Roman", Times, serif;
      font-size: clamp(28px, 6vw, 44px);
      font-weight: 400;
      letter-spacing: 0.08em;
      line-height: 1;
      white-space: nowrap;
      margin-bottom: 56px;
      color: var(--preto);
    }

    /* MENU CENTRALIZADO */
    .menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .menu a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-decoration: none;
      color: var(--preto);
      font-size: 18px;
      font-weight: 400;
      min-width: 220px;
    }

    .simbolo {
      color: var(--azul);
      font-size: 21px;
      line-height: 1;
      min-width: 24px;
      text-align: center;
    }

    .texto {
      text-align: center;
    }

    /* REDES */
    .redes {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .redes a {
      color: var(--azul);
      text-decoration: none;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .home {
        padding: 76px 20px 92px;
      }

      .spiral {
        width: 82px;
        height: 82px;
        margin-bottom: 30px;
      }

      .nome {
        font-size: 7vw;
        letter-spacing: 0.055em;
        margin-bottom: 52px;
      }

      .menu {
        gap: 28px;
      }

      .menu a {
        font-size: 18px;
        min-width: 210px;
      }
    }
  </style>
</head>

<body>

  <main class="home">

    <div class="conteudo">

      <div class="spiral">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path d="
            M78 62
            C72 77, 55 85, 39 79
            C22 72, 16 54, 23 39
            C30 23, 48 17, 63 23
            C79 29, 87 45, 82 59
            C76 75, 60 81, 46 75
            C33 69, 27 55, 32 43
            C37 31, 51 26, 62 31
            C73 36, 78 48, 73 58
            C68 68, 57 72, 48 67
            C39 63, 36 53, 40 45
            C44 37, 53 35, 60 39
            C67 43, 68 51, 64 57
            C60 63, 53 64, 49 60
            C45 56, 46 50, 50 48
          "/>
        </svg>
      </div>

      <h1 class="nome">ANA LUIZA CAMPOS</h1>

      <nav class="menu">

        <a href="#arquitetura">
          <span class="simbolo">+</span>
          <span class="texto">arquitetura</span>
        </a>

        <a href="#social-media">
          <span class="simbolo">°</span>
          <span class="texto">social media</span>
        </a>

        <a href="#curriculo">
          <span class="simbolo">*</span>
          <span class="texto">currículo</span>
        </a>

        <a href="#contato">
          <span class="simbolo">—</span>
          <span class="texto">contato</span>
        </a>

      </nav>

    </div>

    <div class="redes">
      <a href="#" aria-label="LinkedIn">in</a>
      <a href="#" aria-label="Instagram">ig</a>
      <a href="mailto:" aria-label="Email">@</a>
    </div>

  </main>

</body>
</html>
