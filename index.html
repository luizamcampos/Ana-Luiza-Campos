<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfólio de Ana Luiza Campos">
  <title>Ana Luiza Campos</title>

  <style>
    :root {
      --fundo: #f3efe3;
      --azul: #7188aa;
      --amarelo-manteiga: #f8edc4;
      --texto: #383330;
      --marrom: #76594b;
    }

    * {
      box-sizing: border-box;
      font-family: "Times New Roman", Times, serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    html {
      background: var(--fundo);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      background: var(--fundo);
      color: var(--texto);
      font-family: "Times New Roman", Times, serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .index {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 58px 24px 64px;
      text-align: center;
    }

    .logo {
      width: 132px;
      height: 132px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 50%;
      background: var(--azul);
    }

    .logo img {
      display: block;
      width: 79%;
      height: 79%;
      object-fit: contain;
      transform: translateY(1px);
    }

    h1 {
      margin: 76px 0 0;
      color: var(--texto);
      font-size: clamp(36px, 4.7vw, 54px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.035em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    nav {
      margin-top: 66px;
      width: min(330px, 88vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 38px;
    }

    nav a {
      position: relative;
      display: grid;
      grid-template-columns: 28px 170px;
      justify-content: center;
      align-items: center;
      column-gap: 10px;
      width: 100%;
      color: var(--texto);
      font-size: 21px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.01em;
      text-align: center;
      text-decoration: none;
      transition: color 180ms ease;
      min-height: 44px;
      -webkit-tap-highlight-color: transparent;
    }

    nav a > span:last-child {
      grid-column: 2;
      width: 170px;
      justify-self: center;
      text-align: center;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -9px;
      width: 150px;
      height: 1px;
      background: currentColor;
      transform: translateX(-50%) scaleX(0);
      transform-origin: center;
      transition: transform 180ms ease;
    }

    nav a:hover,
    nav a:focus-visible {
      color: var(--marrom);
      outline: none;
    }

    nav a:hover::after,
    nav a:focus-visible::after {
      transform: translateX(-50%) scaleX(1);
    }

    .sinal {
      grid-column: 1;
      justify-self: center;
      width: 28px;
      color: var(--azul);
      font-size: 22px;
      font-weight: 400;
      line-height: 1;
      text-align: center;
    }

    .traco {
      font-size: 22px;
    }

    @media (max-width: 760px) {
      .index {
        justify-content: flex-start;
        padding: 34px 18px 46px;
      }

      .logo {
        width: 104px;
        height: 104px;
      }

      h1 {
        max-width: 92vw;
        margin-top: 48px;
        font-size: clamp(30px, 8.8vw, 38px);
        line-height: 1.08;
        letter-spacing: 0.025em;
        white-space: normal;
      }

      nav {
        width: min(290px, 100%);
        margin-top: 48px;
        gap: 24px;
      }

      nav a {
        grid-template-columns: 24px 150px;
        column-gap: 7px;
        font-size: 18px;
      }

      nav a > span:last-child {
        width: 150px;
      }

      .sinal,
      .traco {
        font-size: 19px;
      }
    }

    @media (max-width: 380px) {
      .index {
        padding-top: 28px;
      }

      .logo {
        width: 92px;
        height: 92px;
      }

      h1 {
        margin-top: 40px;
        font-size: 28px;
      }

      nav {
        margin-top: 40px;
        gap: 20px;
      }

      nav a {
        grid-template-columns: 22px 142px;
        font-size: 17px;
      }

      nav a > span:last-child {
        width: 142px;
      }
    }

    @media (max-height: 620px) and (orientation: landscape) {
      .index {
        padding-top: 24px;
        padding-bottom: 28px;
      }

      .logo {
        width: 88px;
        height: 88px;
      }

      h1 {
        margin-top: 28px;
        font-size: 30px;
      }

      nav {
        margin-top: 28px;
        gap: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      nav a,
      nav a::after {
        transition: none;
      }
    }
  </style>
</head>
