<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ana Luiza Campos</title>

  <style>

    @font-face {
      font-family: "Neue Montreal";
      src: url("./NeueMontreal-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --fundo: #f3f2ed;
      --preto: #111111;
      --azul: #2455ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: var(--fundo);
      color: var(--preto);
    }

    .home {
      min-height: 100svh;
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 48px 24px 42px;
    }

    .main-content {
      width: 100%;
      max-width: 760px;

      display: flex;
      flex-direction: column;
      align-items: center;

      margin: auto 0;
    }

    .spiral {
      width: 105px;
      height: 105px;

      object-fit: contain;
      display: block;

      margin-bottom: 30px;
    }

    .name-image {
      width: 430px;
      max-width: 78vw;
      height: auto;

      display: block;

      margin-bottom: 44px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 22px;

      align-items: flex-start;
    }

    .menu-item {
      display: grid;
      grid-template-columns: 34px auto;
      align-items: center;

      text-decoration: none;
      color: var(--preto);

      font-family: "Neue Montreal", sans-serif;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.02em;

      transition: opacity 0.2s ease;
    }

    .menu-item:hover {
      opacity: 0.55;
    }

    .symbol {
      color: var(--azul);

      font-family: "Neue Montreal", sans-serif;
      font-size: 20px;
      font-weight: 400;

      line-height: 1;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .social {
      display: flex;
      align-items: center;
      gap: 30px;

      margin-top: 42px;
      padding-bottom: 2px;
    }

    .social a {
      color: var(--azul);

      text-decoration: none;

      font-family: "Neue Montreal", sans-serif;
      font-size: 17px;
      font-weight: 400;
    }

    @media (max-width: 600px) {

      .home {
        min-height: 100svh;
        padding: 44px 22px 52px;
      }

      .main-content {
        margin: auto 0;
      }

      .spiral {
        width: 88px;
        height: 88px;
        margin-bottom: 28px;
      }

      .name-image {
        width: 390px;
        max-width: 74vw;
        margin-bottom: 42px;
      }

      .menu {
        gap: 24px;
      }

      .menu-item {
        grid-template-columns: 34px auto;
        font-size: 20px;
      }

      .symbol {
        font-size: 19px;
      }

      .social {
        margin-top: 40px;
        gap: 30px;
      }

      .social a {
        font-size: 17px;
      }

    }

    @media (min-width: 900px) {

      .home {
        padding-top: 40px;
        padding-bottom: 40px;
      }

      .main-content {
        margin: auto 0;
      }

      .spiral {
        width: 92px;
        height: 92px;
        margin-bottom: 24px;
      }

      .name-image {
        width: 360px;
        max-width: 32vw;
        margin-bottom: 34px;
      }

      .menu {
        gap: 16px;
      }

      .menu-item {
        font-size: 16px;
        grid-template-columns: 28px auto;
      }

      .symbol {
        font-size: 16px;
      }

      .social {
        margin-top: 26px;
      }

      .social a {
        font-size: 14px;
      }

    }

  </style>
</head>

<body>

  <main class="home">

    <section class="main-content">

      <img
        class="spiral"
        src="E4C92BBE-623D-486D-94FF-2AF7077F6DED.png"
        alt=""
      >

      <img
        class="name-image"
        src="9DE4427F-D7A4-45B2-A785-B64790E32DC7.png"
        alt="Ana Luiza Campos"
      >

      <nav class="menu">

        <a class="menu-item" href="#arquitetura">
          <span class="symbol">✷</span>
          <span>arquitetura</span>
        </a>

        <a class="menu-item" href="#social-media">
          <span class="symbol">✷</span>
          <span>social media</span>
        </a>

        <a class="menu-item" href="#curriculo">
          <span class="symbol">✷</span>
          <span>currículo</span>
        </a>

        <a class="menu-item" href="#contato">
          <span class="symbol">✷</span>
          <span>contato</span>
        </a>

      </nav>

      <div class="social">
        <a href="#" aria-label="LinkedIn">in</a>
        <a href="mailto:seuemail@email.com" aria-label="E-mail">@</a>
      </div>

    </section>

  </main>

</body>

</html>
