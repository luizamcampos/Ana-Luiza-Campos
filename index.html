<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ana Luiza Campos</title>

  <style>

    @font-face {
      font-family: "Neue Montreal";
      src: url("NeueMontreal-Regular.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --fundo: #f4f2e9;
      --preto: #111111;
      --azul: #2455ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: var(--fundo);
      color: var(--preto);
      font-family: "Neue Montreal", Arial, sans-serif;
    }

    .pagina {
      min-height: 100svh;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding:
        max(70px, env(safe-area-inset-top))
        24px
        max(35px, env(safe-area-inset-bottom));
    }


    /* CONTEÚDO PRINCIPAL */

    .conteudo {
      width: 100%;
      max-width: 620px;

      display: flex;
      flex-direction: column;
      align-items: center;

      margin-top: auto;
      margin-bottom: auto;
    }


    /* ESPIRAL */

    .espiral {
      width: 92px;
      height: auto;
      display: block;

      margin-bottom: 24px;
    }


    /* NOME */

    .nome {
      width: min(520px, 86vw);
      height: auto;
      display: block;

      margin-bottom: 48px;
    }


    /* MENU */

    .menu {
      display: flex;
      flex-direction: column;

      gap: 29px;

      width: fit-content;
    }

    .menu a {
      display: grid;

      grid-template-columns: 35px auto;
      column-gap: 28px;

      align-items: center;

      text-decoration: none;
      color: var(--preto);

      font-size: 29px;
      line-height: 1;
      font-weight: 400;
    }

    .estrela {
      color: var(--azul);

      font-size: 27px;
      line-height: 1;

      text-align: center;
    }


    /* LINKS INFERIORES */

    .social {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 48px;

      margin-top: 55px;
    }

    .social a {
      color: var(--azul);

      text-decoration: none;

      font-size: 21px;
      line-height: 1;
    }


    /* CELULAR */

    @media (max-width: 600px) {

      .pagina {
        padding-left: 22px;
        padding-right: 22px;
      }

      .conteudo {
        transform: translateY(-10px);
      }

      .espiral {
        width: 76px;
        margin-bottom: 20px;
      }

      .nome {
        width: 78vw;
        max-width: 430px;

        margin-bottom: 42px;
      }

      .menu {
        gap: 28px;
      }

      .menu a {
        grid-template-columns: 30px auto;
        column-gap: 25px;

        font-size: 26px;
      }

      .estrela {
        font-size: 24px;
      }

      .social {
        margin-top: 48px;
        gap: 46px;
      }

      .social a {
        font-size: 20px;
      }
    }

  </style>
</head>


<body>

  <main class="pagina">

    <section class="conteudo">

      <!-- ESPIRAL -->

      <img
        class="espiral"
        src="E4C92BBE-623D-486D-94FF-2AF7077F6DED.png"
        alt=""
      >


      <!-- NOME -->

      <img
        class="nome"
        src="9DE4427F-D7A4-45B2-A785-B64790E32DC7.png"
        alt="Ana Luiza Campos"
      >


      <!-- MENU -->

      <nav class="menu">

        <a href="#arquitetura">
          <span class="estrela">✷</span>
          <span>arquitetura</span>
        </a>

        <a href="#social-media">
          <span class="estrela">✷</span>
          <span>social media</span>
        </a>

        <a href="#curriculo">
          <span class="estrela">✷</span>
          <span>currículo</span>
        </a>

        <a href="#contato">
          <span class="estrela">✷</span>
          <span>contato</span>
        </a>

      </nav>

    </section>


    <!-- LINKEDIN + EMAIL -->

    <footer class="social">

      <a
        href="#"
        aria-label="LinkedIn"
      >
        in
      </a>

      <a
        href="mailto:SEUEMAIL@EMAIL.COM"
        aria-label="E-mail"
      >
        @
      </a>

    </footer>

  </main>

</body>

</html>
